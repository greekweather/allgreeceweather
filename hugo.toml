baseURL = 'https://example.com/'
locale = 'el-GR'
title = 'AllGreeceWeather'
pagination.pagerSize = 9
timeZone = 'Europe/Athens'
summaryLength = 35
enableRobotsTXT = true
canonifyURLs = false

[params]
  siteDescription = 'Μετεωρολογικές αναλύσεις, προγνώσεις και άρθρα για τον καιρό στην Ελλάδα.'
  accent = '#1d6fe8'

[taxonomies]
  tag = 'tags'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false

[security]
  enableInlineShortcodes = false
  # Επιτρέπεται μόνο Markdown. Η μη ασφαλής εισαγωγή HTML παραμένει απενεργοποιημένη.
  allowContent = ['^text/markdown$']
  [security.exec]
    allow = 'none'
  [security.http]
    methods = ['GET']
    urls = 'none'
  [security.funcs]
    getenv = ['^HUGO_|^CI$']
