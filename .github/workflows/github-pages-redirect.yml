name: GitHub Pages Redirect

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Create redirect page
        run: |
          mkdir -p site

          cat > site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=https://allgreeceweather.vercel.app/">
            <link rel="canonical" href="https://allgreeceweather.vercel.app/">
            <title>AllGreeceWeather</title>
          </head>
          <body>
            <p>Redirecting to <a href="https://allgreeceweather.vercel.app/">AllGreeceWeather</a>...</p>
          </body>
          </html>
          EOF

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
