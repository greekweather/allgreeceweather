name: Update Popular Posts

on:
  schedule:
    # Every 3 hours, offset from the beginning of the hour
    # to reduce GitHub Actions scheduling delays.
    - cron: "17 */3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-top-posts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Update popular posts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python scripts/update_top_posts.py

      - name: Commit updated ranking
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/top-posts.json

          if git diff --cached --quiet; then
            echo "No changes to popular posts."
            exit 0
          fi

          git commit -m "Update popular posts"
          git push
