<article
  class="post-card"
  data-date="{{ .Date.Unix }}"
  data-tags="{{ with .Params.tags }}{{ range $index, $tag := . }}{{ if $index }}|{{ end }}{{ $tag | urlize }}{{ end }}{{ end }}"
>
  <a class="post-image-link" href="{{ .RelPermalink }}" aria-label="Ανάγνωση του άρθρου: {{ .Title }}">
    {{ with .Params.image }}
      <img class="post-image" src="{{ . | relURL }}" alt="" loading="lazy" decoding="async">
    {{ else }}
      <div class="post-image post-image-placeholder" aria-hidden="true">
        <span>Χωρίς εικόνα</span>
      </div>
    {{ end }}
  </a>

  <div class="post-card-body">

    <div class="post-meta">
      <time class="post-date" data-timestamp="{{ .Date.Unix }}">
        {{ .Date.Format "02/01/2006 15:04" }}
      </time>
    </div>

    <h3>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    </h3>

    <p>
      {{ .Description | default (.Summary | plainify) }}
    </p>

    {{ with .Params.tags }}
      <div class="post-tags">
        {{ range . }}
          <span class="post-tag">{{ . }}</span>
        {{ end }}
      </div>
    {{ end }}

    <a class="text-link" href="{{ .RelPermalink }}">
      Διαβάστε το άρθρο
      <span aria-hidden="true">→</span>
    </a>

  </div>
</article>
