{{ define "head" }}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
{{ end }}

{{ define "main" }}
<section class="page-header">
  <div class="container">
    <h1>{{ .Title }}</h1>
    <p>{{ .Description }}</p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div id="weather-map" class="map-container" role="application" aria-label="Διαδραστικός χάρτης καιρού της Ελλάδας"></div>
    <p class="map-attribution">
      Βασικός χάρτης © <a href="https://openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>,
      ραντάρ © <a href="https://www.rainviewer.com/" target="_blank" rel="noopener">RainViewer</a>.
    </p>
  </div>
</section>
{{ end }}

{{ define "scripts" }}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="{{ "js/weather-map.js" | relURL }}"></script>
{{ end }}
