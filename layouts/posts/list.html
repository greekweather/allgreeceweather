{{ define "main" }}

<section class="page-header">
  <div class="container">
    <p class="eyebrow">ΑΡΧΕΙΟ</p>
    <h1>Άρθρα</h1>
    <p>Όλα τα δημοσιευμένα άρθρα.</p>
  </div>
</section>

<section class="section">
  <div class="container">

    <div class="article-filters">

      <label>
        <span>Ετικέτα</span>
        <select id="tag-filter">
          <option value="all">Όλες οι ετικέτες</option>
          {{ range first 10 .Site.Taxonomies.tags.ByCount }}
            <option value="{{ .Page.Title | urlize }}">
              {{ .Page.Title }} ({{ .Count }})
            </option>
          {{ end }}
        </select>
      </label>

      <label>
        <span>Ταξινόμηση</span>
        <select id="sort-filter">
          <option value="newest">Νεότερα → Παλαιότερα</option>
          <option value="oldest">Παλαιότερα → Νεότερα</option>
          <option value="popular">Δημοφιλέστερα</option>
        </select>
      </label>

    </div>

    <div class="post-grid" id="articles-grid">

      {{ range .Pages }}
        {{ partial "post-card.html" . }}
      {{ else }}
        <p>Δεν υπάρχουν ακόμη άρθρα.</p>
      {{ end }}

    </div>

    <p class="no-results" id="no-results" hidden>
      Δεν βρέθηκαν άρθρα με τα συγκεκριμένα φίλτρα.
    </p>

  </div>
</section>

<script>
document.addEventListener("DOMContentLoaded", async function () {
  const grid = document.getElementById("articles-grid");
  const tagFilter = document.getElementById("tag-filter");
  const sortFilter = document.getElementById("sort-filter");
  const noResults = document.getElementById("no-results");

  if (!grid || !tagFilter || !sortFilter) {
    return;
  }

  const cards = Array.from(grid.querySelectorAll(".post-card"));

  let topPosts = [];

  try {
    const response = await fetch(
      "{{ "data/top-posts.json" | relURL }}",
      {
        cache: "no-store"
      }
    );

    if (response.ok) {
      const data = await response.json();

      topPosts = Array.isArray(data.posts) ? data.posts : [];
    }
  } catch (error) {
    console.warn("Could not load top-posts.json:", error);
  }

  const popularity = new Map();

  topPosts.forEach(function (post, index) {
    if (typeof post === "string") {
      popularity.set(post, {
        rank: index,
        visits: 0
      });
      return;
    }

    if (!post || typeof post !== "object") {
      return;
    }

    const path =
      post.path ||
      post.url ||
      post.permalink ||
      post.href;

    if (!path) {
      return;
    }

    const visits = Number(
      post.visits ??
      post.views ??
      post.count ??
      0
    );

    popularity.set(path, {
      rank: index,
      visits: Number.isFinite(visits) ? visits : 0
    });
  });

  function normalizePath(path) {
    if (!path) {
      return "";
    }

    try {
      path = new URL(path, window.location.origin).pathname;
    } catch (error) {
    }

    if (path.endsWith("/") === false) {
      path += "/";
    }

    return path;
  }

  function getCardPath(card) {
    const link = card.querySelector("a[href]");

    if (!link) {
      return "";
    }

    return normalizePath(link.getAttribute("href"));
  }

  function getPopularity(card) {
    const path = getCardPath(card);

    if (!path) {
      return null;
    }

    if (popularity.has(path)) {
      return popularity.get(path);
    }

    const withoutSlash = path.endsWith("/")
      ? path.slice(0, -1)
      : path;

    if (popularity.has(withoutSlash)) {
      return popularity.get(withoutSlash);
    }

    for (const [storedPath, value] of popularity.entries()) {
      if (normalizePath(storedPath) === path) {
        return value;
      }
    }

    return null;
  }

  function updateArticles() {
    const selectedTag = tagFilter.value;
    const sortOrder = sortFilter.value;

    cards.sort(function (a, b) {

      if (sortOrder === "popular") {
        const popularityA = getPopularity(a);
        const popularityB = getPopularity(b);

        if (popularityA && !popularityB) {
          return -1;
        }

        if (!popularityA && popularityB) {
          return 1;
        }

        if (popularityA && popularityB) {
          if (popularityB.visits !== popularityA.visits) {
            return popularityB.visits - popularityA.visits;
          }

          return popularityA.rank - popularityB.rank;
        }

        return Number(b.dataset.date) - Number(a.dataset.date);
      }

      const dateA = Number(a.dataset.date);
      const dateB = Number(b.dataset.date);

      if (sortOrder === "oldest") {
        return dateA - dateB;
      }

      return dateB - dateA;
    });

    cards.forEach(function (card) {
      grid.appendChild(card);
    });

    let visibleCount = 0;

    cards.forEach(function (card) {
      const tags = card.dataset.tags
        ? card.dataset.tags.split("|")
        : [];

      const matchesTag =
        selectedTag === "all" ||
        tags.includes(selectedTag);

      card.hidden = !matchesTag;

      if (matchesTag) {
        visibleCount++;
      }
    });

    noResults.hidden = visibleCount !== 0;
  }

  tagFilter.addEventListener("change", updateArticles);
  sortFilter.addEventListener("change", updateArticles);

  updateArticles();
});
</script>

{{ end }}
