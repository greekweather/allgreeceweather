{{ define "main" }}
<article class="article">
  <div class="container article-container">
    <header class="article-header">
      <a class="back-link" href="{{ "posts/" | relURL }}">← Όλα τα άρθρα</a>
      <p class="post-meta">
        <time class="post-date" data-timestamp="{{ .Date.Unix }}">
            {{ .Date.Format "02/01/2006 15:04" }}
        </time>
      </p>
      <h1>{{ .Title }}</h1>
      {{ with .Description }}<p class="article-lead">{{ . }}</p>{{ end }}
    </header>

    {{ with resources.Get .Params.image }}
    <figure class="article-hero">
      {{ with .Process "resize 1600x webp q85" }}
      <img
        src="{{ .RelPermalink }}"
        width="{{ .Width }}"
        height="{{ .Height }}"
        alt="{{ $.Title }}"
        decoding="async"
      >
      {{ end }}
    </figure>
    {{ end }}

    <div class="article-body">
      {{ .Content }}
    </div>
  </div>
</article>
{{ end }}
